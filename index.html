<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="独立科研团队主页模板。">
  <title>研究共同体</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="./content.js"></script>
  <script defer src="./site.js"></script>
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>
  <header class="top" id="top">
    <div class="wrap nav">
      <a class="brand" href="#top"><span class="mark" aria-hidden="true">✳</span><span data-name>研究共同体</span></a>
      <nav aria-label="页面导航">
        <a href="#research">研究</a><a href="#work">成果</a><a href="#people">成员</a><a href="#contact">合作</a>
      </nav>
    </div>
  </header>
  <main id="main">
    <section class="hero wrap" aria-labelledby="headline">
      <div class="hero-copy">
        <p class="label">INDEPENDENT RESEARCH</p>
        <h1 id="headline">从共同的问题出发</h1>
        <p id="intro" class="intro"></p>
        <a class="button" href="#research">探索我们的研究 <span aria-hidden="true">↘</span></a>
      </div>
      <div id="hero-art" class="hero-art" aria-hidden="true"></div>
    </section>
    <section class="section wrap" id="research" aria-labelledby="research-title">
      <div class="section-heading"><p class="label">RESEARCH</p><h2 id="research-title">研究方向</h2></div>
      <div class="research-grid" id="research-list"></div>
    </section>
    <section class="tinted" id="work" aria-labelledby="work-title">
      <div class="section wrap">
        <div class="section-heading"><p class="label">SELECTED WORK</p><h2 id="work-title">研究成果</h2></div>
        <div id="work-list"></div>
      </div>
    </section>
    <section class="section wrap" id="people" aria-labelledby="people-title">
      <div class="section-heading"><p class="label">PEOPLE</p><h2 id="people-title">一起做研究的人</h2></div>
      <div class="people-grid" id="people-list"></div>
    </section>
    <section class="contact" id="contact" aria-labelledby="contact-title">
      <div class="section wrap">
        <p class="label">COLLABORATE</p><h2 id="contact-title">交流与合作</h2>
        <p id="contact-copy"></p>
        <a id="contact-link" class="button" hidden>联系我们 <span aria-hidden="true">↗</span></a>
      </div>
    </section>
  </main>
  <footer class="wrap footer"><span data-name>研究共同体</span><a href="#top">回到顶部 ↑</a></footer>
  <noscript><p class="wrap">请启用 JavaScript 以加载研究与成员信息。</p></noscript>
</body>
</html>
